<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Login</title>
  </head>
  <body>
    <main>
      <section class="wrapper">
        <div class="column left">
          <div class="form-container">
            <span class="form-title">Minha conta</span>
            <form>
              <input
                type="email"
                required
                placeholder="Digite seu email"
                name="email"
              />
              <input
                type="password"
                required
                placeholder="Digite sua senha"
                name="password"
              />
              <button type="submit" class="form-button">Acessar</button>
            </form>
            <div class="signup-section">
              <span>
                <strong>Novo por aqui?</strong>
                <a href="pages/signup.html">Cadastre-se</a>
              </span>
            </div>
          </div>
        </div>
        <div class="column right">
          <div class="image-container">
            <img src="assets/info.png" alt="info" />
          </div>
          <div class="content-container">
            <h1>Leve sua carreira para o próximo nível.</h1>
            <p>
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos
              impedit eaque at? Velit alias ex culpa iste maxime delectus
              recusandae harum facere.
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
